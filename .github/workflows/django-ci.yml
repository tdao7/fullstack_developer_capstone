name: Django CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q server
      - name: Generate and apply migrations
        run: |
          cd server
          python manage.py makemigrations djangoapp --noinput
          python manage.py migrate --noinput
      - name: Seed demo content
        run: cd server && python manage.py seed_demo
      - name: Run Django system checks
        run: cd server && python manage.py check
      - name: Run Django tests
        run: cd server && python manage.py test djangoapp --verbosity 2
