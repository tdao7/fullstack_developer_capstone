name: Capstone two-job lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-lint:
    name: Backend Python Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install ruff
      - name: Run Linter
        run: ruff check --select E4,E7,E9,F63 server/djangoapp server/djangoproj
  frontend-lint:
    name: Frontend JavaScript Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-save eslint@9
      - name: Run Linter
        run: npx eslint --no-config-lookup --rule 'no-unexpected-multiline: error' --rule 'valid-typeof: error' server/frontend/static/site.js
