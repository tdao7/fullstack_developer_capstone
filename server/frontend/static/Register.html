<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Create your account | Best Cars</title></head><body><nav class="navbar"><div class="navin"><a class="brand" href="/">BEST<span>CARS</span><small>DEALERSHIP REVIEWS</small></a><div class="navlinks"><a href="/" data-nav="home">Home</a><a href="/about" data-nav="about">About us</a><a href="/contact" data-nav="contact">Contact</a><a href="/register" data-nav="register">Register</a></div><div class="navuser" id="navuser"><button id="loginBtn" class="secondary">Log in</button></div></div></nav><header class="hero"><div class="wrap"><span class="eyebrow">Join the community</span><h1>Create your account</h1><p>Sign up to share your dealership experiences and help other drivers.</p></div></header><main class="main" style="max-width:700px"><div class="panel"><h2 class="heading">Sign up</h2><form id="signup" class="formgrid"><label class="field">Username<input id="username" required></label><label class="field">First name<input id="firstName" required></label><label class="field">Last name<input id="lastName" required></label><label class="field">Email<input id="email" type="email" required></label><label class="field wide">Password<input id="password" type="password" minlength="8" required></label><div class="wide"><p id="registerMessage"></p><button class="primary" type="submit">Register</button></div></form></div></main><footer class="footer">© 2026 BESTCARS · Educational project · All dealership and staff details are fictional.</footer><script src="/static/site.js"></script><script>
$('#signup').onsubmit=async e=>{e.preventDefault();let payload=Object.fromEntries(['username','firstName','lastName','email','password'].map(k=>[k,$('#'+k).value]));payload.userName=payload.username;let r=await fetch('/djangoapp/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let data=await r.json();$('#registerMessage').className=r.ok?'success':'error';$('#registerMessage').innerText=r.ok?'Account created. You may log in.':data.message||'Registration failed'};</script></body></html>
